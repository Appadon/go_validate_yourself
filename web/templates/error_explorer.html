<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{.Title}}</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="/static/css/app.css?v={{.Version}}-error-explorer">
    <link rel="stylesheet" href="/static/css/error_explorer.css?v={{.Version}}-error-explorer">
  </head>
  <body>
    <div class="app-shell error-shell {{if .SchemaEditorEmbed}}error-shell--embed{{end}}">
      {{if not .SchemaEditorEmbed}}
      <header class="topbar">
        <div class="topbar__copy">
          <p class="eyebrow">Errors</p>
          <h1>Error Explorer</h1>
          <p class="lede">Validation error summaries and row samples.</p>
        </div>
        <div class="topbar__status">
          <section class="status-card">
            <span class="status-card__label">Root</span>
            <strong class="status-card__path">{{.WorkingRoot}}</strong>
          </section>
        </div>
      </header>
      {{end}}

      <main class="error-layout">
        <section class="panel error-panel" aria-label="Error explorer">

          <div class="error-toolbar">
            <input id="error-report-path-input" type="hidden" value="errors">
            <button id="error-report-browse-button" class="button button--secondary" type="button" title="Selected: errors">Browse</button>
            <label class="field-control" for="error-report-query-input">
              <span>Search</span>
              <input id="error-report-query-input" type="search" autocomplete="off" placeholder="Message, row value, or file">
            </label>
            <label class="field-control" for="error-report-field-input">
              <span>Field</span>
              <input id="error-report-field-input" type="search" autocomplete="off" placeholder="Any field">
            </label>
            <span id="error-report-status" class="badge badge--muted">Not loaded</span>
          </div>

          <p id="error-report-message" class="form-message" aria-live="polite"></p>
          <div id="error-report-content" class="error-report-content"></div>
        </section>
      </main>
    </div>

    <div id="error-dir-picker-modal" class="picker-modal" hidden>
      <div id="error-dir-picker-backdrop" class="picker-modal__backdrop"></div>
      <section class="picker-panel" role="dialog" aria-modal="true" aria-labelledby="error-dir-picker-title">
        <div class="panel__head">
          <div>
            <p class="eyebrow">Browse</p>
            <h2 id="error-dir-picker-title">Select Error Directory</h2>
            <p class="panel-note">Choose a directory that contains existing error Parquet files.</p>
          </div>
          <button id="error-dir-picker-close-button" class="button button--secondary button--small" type="button">Close</button>
        </div>

        <label class="filter-field" for="error-dir-picker-filter-input">
          <span>Filter</span>
          <input id="error-dir-picker-filter-input" type="search" placeholder="Filter by folder" autocomplete="off">
        </label>

        <div class="picker-path-row">
          <code id="error-dir-picker-path-value">/</code>
          <button id="error-dir-picker-up-button" class="button button--secondary button--small" type="button">Up</button>
        </div>

        <div id="error-dir-picker-directories" class="directory-list" aria-live="polite"></div>
        <select id="error-dir-picker-select" class="file-select file-select--modal" size="10"></select>

        <div class="picker-actions">
          <p id="error-dir-picker-selection-summary" class="selection-summary">No directory selected.</p>
          <button id="error-dir-picker-current-button" class="button button--secondary" type="button">Use current directory</button>
          <button id="error-dir-picker-choose-button" class="button button--primary" type="button">Use selected directory</button>
        </div>
      </section>
    </div>

    <div id="error-file-modal" class="picker-modal" hidden>
      <div id="error-file-backdrop" class="picker-modal__backdrop"></div>
      <section class="error-file-panel" role="dialog" aria-modal="true" aria-labelledby="error-file-title">
        <div class="error-file-panel__head">
          <div>
            <h2 id="error-file-title">Error File</h2>
          </div>
          <button id="error-file-close-button" class="button button--secondary button--small" type="button">Close</button>
        </div>
        <div id="error-file-content" class="error-file-content"></div>
      </section>
    </div>

    <script>
      window.GVY_UI_BOOTSTRAP = {{.BootstrapJSON}};
    </script>
    <script src="/static/js/file_browser.js?v={{.Version}}-error-explorer" defer></script>
    <script src="/static/js/error_explorer.js?v={{.Version}}-error-explorer" defer></script>
  </body>
</html>
